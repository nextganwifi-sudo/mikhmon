server {
    listen 80;
    index index.php;
    root /var/www/;

    # Runtime configuration, data stores, backups, deployment scripts, Git metadata and environment files are private.
    location ~* ^/(include/|data/|backups/|deploy/|uploads/reseller-templates/|\.git/|\.aistudio/|\.env) {
        deny all;
        return 404;
    }

    # Uploaded PHP templates may be included internally, but must never execute via direct HTTP requests.
    location ~* ^/(uploads|voucher)/.*\.(php[0-9]?|phtml|phar|cgi|pl|sh)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_7_4:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
