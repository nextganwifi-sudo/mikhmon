<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84" role="img" aria-label="MikroTik RB4011 RB5009 Router">
  <defs>
    <linearGradient id="rb4kTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rb4kFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="72" rx="52" ry="5" fill="#020617" opacity="0.38"/>
  <!-- Finned Metal Heatsink Top -->
  <path d="M10 33 L18 19 H102 L110 33 Z" fill="url(#rb4kTop)" stroke="#475569" stroke-width="1.2"/>
  <g stroke="#0f172a" stroke-width="1.3" opacity="0.75">
    <line x1="25" y1="21" x2="21" y2="31"/>
    <line x1="35" y1="21" x2="32" y2="31"/>
    <line x1="45" y1="21" x2="43" y2="31"/>
    <line x1="55" y1="21" x2="54" y2="31"/>
    <line x1="65" y1="21" x2="66" y2="31"/>
    <line x1="75" y1="21" x2="77" y2="31"/>
    <line x1="85" y1="21" x2="88" y2="31"/>
    <line x1="95" y1="21" x2="99" y2="31"/>
  </g>
  <!-- Matte Black Aluminum Faceplate -->
  <rect x="8" y="33" width="104" height="34" rx="4" fill="url(#rb4kFace)" stroke="#475569" stroke-width="1.3"/>
  <rect x="13" y="42" width="94" height="19" rx="2.5" fill="#020617" stroke="#334155" stroke-width="0.9"/>
  <!-- 8 Gigabit Ports + 10G SFP+ Cage -->
  <g fill="#0f172a" stroke="#64748b" stroke-width="0.85">
    <rect x="17" y="46" width="8.5" height="10" rx="1"/>
    <rect x="27" y="46" width="8.5" height="10" rx="1"/>
    <rect x="37" y="46" width="8.5" height="10" rx="1"/>
    <rect x="47" y="46" width="8.5" height="10" rx="1"/>
    <rect x="57" y="46" width="8.5" height="10" rx="1"/>
    <rect x="67" y="46" width="8.5" height="10" rx="1"/>
    <rect x="77" y="46" width="8.5" height="10" rx="1"/>
  </g>
  <!-- 10G SFP+ Cage -->
  <rect x="90" y="45.5" width="12.5" height="11" rx="1.2" fill="#020617" stroke="#38bdf8" stroke-width="1.1"/>
  <rect x="93" y="49" width="6.5" height="4" rx="0.6" fill="#0ea5e9" opacity="0.45"/>
  <!-- Status LEDs -->
  <circle cx="17" cy="37.5" r="1.7" fill="#38bdf8"/>
  <circle cx="23" cy="37.5" r="1.7" fill="#22c55e"/>
  <circle cx="29" cy="37.5" r="1.7" fill="#38bdf8"/>
  <text x="104" y="39.5" text-anchor="end" font-family="sans-serif" font-size="6.4" font-weight="800" fill="#94a3b8">RB PRO</text>
