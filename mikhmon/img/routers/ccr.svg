<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84" role="img" aria-label="MikroTik Cloud Core Router CCR">
  <defs>
    <linearGradient id="ccrBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe4ef"/>
    </linearGradient>
    <linearGradient id="ccrTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="71" rx="55" ry="4.5" fill="#0f172a" opacity="0.28"/>
  <!-- Rackmount Ears -->
  <rect x="4" y="33" width="6" height="30" rx="1.5" fill="#94a3b8" stroke="#64748b" stroke-width="0.9"/>
  <circle cx="7" cy="39" r="1.3" fill="#1e293b"/>
  <circle cx="7" cy="57" r="1.3" fill="#1e293b"/>
  <rect x="110" y="33" width="6" height="30" rx="1.5" fill="#94a3b8" stroke="#64748b" stroke-width="0.9"/>
  <circle cx="113" cy="39" r="1.3" fill="#1e293b"/>
  <circle cx="113" cy="57" r="1.3" fill="#1e293b"/>
  <!-- 1U White Cloud Core Chassis -->
  <path d="M12 32 L18 22 H102 L108 32 Z" fill="url(#ccrTop)" stroke="#94a3b8" stroke-width="1.1"/>
  <rect x="10" y="32" width="100" height="32" rx="3" fill="url(#ccrBody)" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="14" y="39" width="92" height="20" rx="2" fill="#1e293b"/>
  <!-- Multi-Port RJ45 Bank -->
  <g fill="#090d16" stroke="#64748b" stroke-width="0.75">
    <rect x="17" y="43" width="7.5" height="6" rx="0.8"/>
    <rect x="26" y="43" width="7.5" height="6" rx="0.8"/>
    <rect x="35" y="43" width="7.5" height="6" rx="0.8"/>
    <rect x="44" y="43" width="7.5" height="6" rx="0.8"/>
    <rect x="17" y="51" width="7.5" height="6" rx="0.8"/>
    <rect x="26" y="51" width="7.5" height="6" rx="0.8"/>
    <rect x="35" y="51" width="7.5" height="6" rx="0.8"/>
    <rect x="44" y="51" width="7.5" height="6" rx="0.8"/>
  </g>
  <!-- Dual SFP+ Optical Bays -->
  <g fill="#020617" stroke="#38bdf8" stroke-width="0.95">
    <rect x="56" y="44" width="10" height="11" rx="1"/>
    <rect x="68.5" y="44" width="10" height="11" rx="1"/>
  </g>
  <!-- CCR Color LCD Panel -->
  <rect x="83" y="42.5" width="19" height="13.5" rx="1.6" fill="#0369a1" stroke="#7dd3fc" stroke-width="0.9"/>
  <path d="M85.5 52 L89 48 L92 50 L95.5 45.5 L99.5 47.5" fill="none" stroke="#e0f2fe" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Top Bar LEDs & CCR Label -->
  <circle cx="16.5" cy="35.6" r="1.4" fill="#22c55e"/>
  <circle cx="21.5" cy="35.6" r="1.4" fill="#38bdf8"/>
  <text x="104" y="37.2" text-anchor="end" font-family="sans-serif" font-size="6.6" font-weight="800" fill="#0f172a">CCR</text>
</svg>
