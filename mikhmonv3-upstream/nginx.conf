server {
    listen 80;
    index index.php;
    root /var/www/;

    # Runtime configuration, backups, deployment scripts, Git metadata and environment files are private.
    location ~* ^/(include/|backups/|deploy/|\.git/|\.aistudio/|\.env) {
        deny all;
        return 404;
    }

    # Uploaded PHP templates may be included internally, but must never execute via direct HTTP requests.
    location ~* ^/(uploads|voucher)/.*\.(php[0-9]?|phtml|phar|cgi|pl|sh)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_7_4:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
