<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84" role="img" aria-label="MikroTik RB2011 Router">
  <defs>
    <linearGradient id="rb2011Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="rb2011Top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="72" rx="52" ry="5" fill="#0f172a" opacity="0.32"/>
  <path d="M12 31 L20 20 H100 L108 31 Z" fill="url(#rb2011Top)" stroke="#7f1d1d" stroke-width="1.2"/>
  <rect x="8" y="31" width="104" height="36" rx="4" fill="url(#rb2011Body)" stroke="#7f1d1d" stroke-width="1.3"/>
  <rect x="13" y="38" width="94" height="24" rx="2.5" fill="#18181b" stroke="#3f3f46" stroke-width="0.9"/>
