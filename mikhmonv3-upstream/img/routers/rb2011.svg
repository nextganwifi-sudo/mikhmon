  <rect x="17" y="42" width="16" height="16" rx="1.6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.9"/>
  <path d="M19 53 L22 49 L25 51 L28 45 L31 48" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
