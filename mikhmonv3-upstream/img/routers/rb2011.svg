    <rect x="80.5" y="42" width="8.5" height="7" rx="1"/>
    <rect x="91" y="42" width="8.5" height="7" rx="1"/>
    <rect x="49" y="51.5" width="8.5" height="7" rx="1"/>
    <rect x="59.5" y="51.5" width="8.5" height="7" rx="1"/>
    <rect x="70" y="51.5" width="8.5" height="7" rx="1"/>
    <rect x="80.5" y="51.5" width="8.5" height="7" rx="1"/>
    <rect x="91" y="51.5" width="8.5" height="7" rx="1"/>
  </g>
  <g fill="#22c55e">
    <circle cx="51" cy="43.8" r="1"/>
    <circle cx="61.5" cy="43.8" r="1"/>
    <circle cx="72" cy="43.8" r="1"/>
    <circle cx="82.5" cy="53.3" r="1"/>
    <circle cx="93" cy="53.3" r="1"/>
